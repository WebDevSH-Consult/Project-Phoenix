<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />
	<title>Phoenix Remote</title>
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<div class="section" id="action-section"></div>

	<details class="section" id="connection">
		<summary>Streamlabs connection <span id="status-dot" class="dot"></span></summary>
		<div class="row">
			<label for="host">Streaming PC IP</label>
			<input id="host" type="text" placeholder="192.168.1.119" />
		</div>
		<div class="row">
			<label for="port">Port</label>
			<input id="port" type="number" placeholder="59650" />
		</div>
		<div class="row">
			<label for="token">Token</label>
			<input id="token" type="password" autocomplete="off" placeholder="Paste from Streamlabs → Settings → Remote Control" />
		</div>
		<div class="row">
			<label></label>
			<button id="save">Save &amp; connect</button>
		</div>
		<p class="hint">Shared by every Phoenix Remote key. The token is stored by Stream Deck on this PC only.</p>
	</details>

	<p class="status" id="status"></p>

	<script src="pi.js"></script>
</body>
</html>
